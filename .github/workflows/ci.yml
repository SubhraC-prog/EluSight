name: EluSight CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.4.2"

jobs:
  # Job 1: Code Quality and Linting
  lint:
    name: 🔍 Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy isort pre-commit
      
      - name: Run Black (code formatting check)
        run: |
          if [ -d "elusight" ] && [ -d "tests" ]; then
            black --check --line-length 88 elusight/ tests/
          else
            echo "Skipping Black: source directories not found"
          fi
      
      - name: Run isort (import sorting)
        run: |
          if [ -d "elusight" ] && [ -d "tests" ]; then
            isort --check-only --profile black elusight/ tests/
          else
            echo "Skipping isort: source directories not found"
          fi
      
      - name: Run Ruff (fast linting)
        run: |
          if [ -d "elusight" ] && [ -d "tests" ]; then
            ruff check elusight/ tests/
          else
            echo "Skipping Ruff: source directories not found"
          fi
      
      - name: Run mypy (type checking)
        run: |
          if [ -d "elusight" ]; then
            mypy elusight/ --ignore-missing-imports --no-strict-optional
          else
            echo "Skipping mypy: source directory not found"
          fi

  # Job 2: Unit Tests with Multiple Python Versions
  test:
    name: 🧪 Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        test-type: ["unit", "integration"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.python-version }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-xdist pytest-timeout pytest-mock
      
      - name: Run ${{ matrix.test-type }} tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            pytest tests/ -v -m "not integration" --cov=elusight --cov-report=xml --cov-report=html --timeout=30 -n auto
          else
            pytest tests/ -v -m integration --cov=elusight --cov-report=xml --cov-report=html --timeout=60 -n auto
          fi
        env:
          PYTHONPATH: .
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: ${{ matrix.test-type }}
          name: ${{ matrix.python-version }}-${{ matrix.test-type }}
          fail_ci_if_error: false

  # Job 3: Performance Benchmarks
  benchmark:
    name: ⚡ Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest-benchmark memory-profiler
      
      - name: Run benchmarks
        run: |
          pytest tests/benchmarks/ -v --benchmark-only --benchmark-json=benchmark_results.json
      
      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

  # Job 4: Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        run: |
          pip install bandit safety pip-audit
      
      - name: Run Bandit (security linter)
        run: bandit -r elusight/ -f json -o bandit_report.json || true
      
      - name: Run Safety (dependency vulnerabilities)
        run: safety check --json --output safety_report.json || true
      
      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt --format json --output pip_audit.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit_report.json
            safety_report.json
            pip_audit.json
          retention-days: 30

  # Job 5: Documentation Build
  docs:
    name: 📚 Documentation Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser
      
      - name: Build documentation
        run: |
          if [ -d "docs" ]; then
            cd docs && make html || echo "Documentation build skipped"
          else
            echo "No docs directory found"
          fi
      
      - name: Check for broken links
        run: |
          pip install linkchecker
          linkchecker http://localhost:8000 --no-status || true

  # Job 6: Build and Test Docker Image
  docker:
    name: 🐳 Docker Build & Test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: elusight:test
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      
      - name: Test Docker container
        run: |
          docker run --rm elusight:test python -c "from elusight import __version__; print(f'Version: {__version__}')"
          docker run --rm -d -p 8000:8000 --name elusight-test elusight:test
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop elusight-test
      
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Job 7: Platform Compatibility Tests
  platform:
    name: 💻 Platform Compatibility
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies (Ubuntu/MacOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      
      - name: Run compatibility tests
        run: |
          pytest tests/test_compatibility.py -v --tb=short
      
      - name: Test import
        run: |
          python -c "from elusight import __version__; print(f'EluSight {__version__} imported successfully on ${{ runner.os }}')"

  # Job 8: Integration Tests with External Optimizers
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]
          pip install optuna pymoo scikit-optimize gpytorch botorch
      
      - name: Test Optuna integration
        run: |
          python -c "
          from elusight.integrations.adapters import OptimizerOutputAdapter
          import optuna
          
          def objective(trial):
              x = trial.suggest_float('x', -10, 10)
              y = trial.suggest_float('y', -10, 10)
              return (x - 2)**2 + (y + 3)**2
          
          study = optuna.create_study()
          study.optimize(objective, n_trials=10)
          
          methods = OptimizerOutputAdapter.from_optuna({'trials': study.trials})
          print(f'Successfully converted {len(methods)} Optuna trials')
          assert len(methods) > 0
          "
      
      - name: Test pymoo integration
        run: |
          python -c "
          from elusight.integrations.adapters import OptimizerOutputAdapter
          import numpy as np
          
          mock_result = {
              'X': np.array([[1.0, 2.0], [3.0, 4.0]]),
              'F': np.array([[0.1, 0.2], [0.3, 0.4]]),
              'rank': [1, 2]
          }
          
          methods = OptimizerOutputAdapter.from_pymoo(
              mock_result, 
              variable_names=['x', 'y'], 
              objective_names=['obj1', 'obj2']
          )
          print(f'Successfully converted {len(methods)} pymoo solutions')
          assert len(methods) == 2
          "
      
      - name: Test API endpoint
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from elusight.api.routes import app
          
          client = TestClient(app)
          response = client.get('/health')
          assert response.status_code == 200
          assert response.json()['status'] == 'healthy'
          print('API health check passed')
          "

  # Job 9: Code Coverage Report
  coverage:
    name: 📊 Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov coverage
      
      - name: Run full coverage
        run: |
          pytest tests/ -v --cov=elusight --cov-report=xml --cov-report=html --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Store coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  # Job 10: Package Build and Test
  package:
    name: 📦 Package Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel
      
      - name: Build package
        run: |
          python -m build
          twine check dist/*
      
      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "from elusight import __version__; print(f'Package version: {__version__}')"
      
      - name: Store package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 30

  # Job 11: Deploy to PyPI (on release/tag)
  deploy-pypi:
    name: 🚀 Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [package, test, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/elusight
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: |
          python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true

  # Job 12: Deploy Documentation
  deploy-docs:
    name: 📖 Deploy Documentation
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
          publish_branch: gh-pages
          force_orphan: true

  # Job 13: Notification on Failure
  notify:
    name: 📧 Notifications
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker, integration]
    if: always() && (failure() || success())
    
    steps:
      - name: Check status
        id: status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification (if configured)
        if: steps.status.outputs.status == 'failure' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ EluSight CI Pipeline Failed!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *EluSight CI Pipeline Failed*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
      
      - name: Send email notification (if configured)
        if: steps.status.outputs.status == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "EluSight CI Pipeline Failed"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: EluSight CI
          body: |
            The EluSight CI pipeline has failed.
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run ID: ${{ github.run_id }}
            
            Check the workflow run for details.

  # Job 14: Final Summary
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, docker, integration, coverage, package]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# EluSight CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All tests passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed. Please check the logs." >> $GITHUB_STEP_SUMMARY
          fi
