[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elusight"
version = "1.0.0"
description = "EluSight - Chromatographic Decision Intelligence Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SubhraC-prog", email = "subhrac@example.com"}
]
keywords = ["chromatography", "hplc", "optimization", "machine-learning", "decision-intelligence", "aqbd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "shap>=0.42.0,<1.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "plotly>=5.17.0,<6.0.0",
    "streamlit>=1.25.0,<2.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pyarrow>=12.0.0,<15.0.0",
    "tqdm>=4.65.0,<5.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.0.280,<1.0.0",
    "mypy>=1.4.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/SubhraC-prog/EluSight"
Repository = "https://github.com/SubhraC-prog/EluSight.git"
Issues = "https://github.com/SubhraC-prog/EluSight/issues"

[project.scripts]
elusight-api = "api.routes:run_api"
elusight-dashboard = "dashboard.app:run_dashboard"
elusight-verify = "verify_installation:main"

[tool.setuptools]
packages = ["api", "constraints", "dashboard", "explainability", "ingest", "integrations", "preferences", "reasoning", "reports", "risk", "robustness", "schemas", "tradeoffs", "trust", "uncertainty"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.py", "*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
select = ["E", "W", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ["-v", "--tb=short"]
