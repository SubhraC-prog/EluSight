[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elusight"
version = "1.0.0"
description = "EluSight - Chromatographic Decision Intelligence Framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SubhraC-prog", email = "subhrac@example.com"}
]
maintainers = [
    {name = "SubhraC-prog", email = "subhrac@example.com"}
]
keywords = ["chromatography", "hplc", "optimization", "machine-learning", "decision-intelligence", "aqbd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    
    # Data validation
    "pydantic>=2.0.0,<3.0.0",
    
    # Machine Learning
    "scikit-learn>=1.3.0,<2.0.0",
    "shap>=0.42.0,<1.0.0",
    
    # Visualization
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
    "plotly>=5.17.0,<6.0.0",
    
    # Dashboard
    "streamlit>=1.25.0,<2.0.0",
    
    # API
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    
    # Data processing
    "sqlalchemy>=2.0.0,<3.0.0",
    "pyarrow>=12.0.0,<15.0.0",
    
    # Utilities
    "tqdm>=4.65.0,<5.0.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-xdist>=3.3.0,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-mock>=3.11.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "black>=23.0.0,<24.0.0",
    "ruff>=0.0.280,<1.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.4.0,<2.0.0",
    "pre-commit>=3.3.0,<4.0.0",
    "bandit>=1.7.5,<2.0.0",
    "safety>=2.3.0,<3.0.0",
]

gp = [
    "gpytorch>=1.9.0,<2.0.0",
    "botorch>=0.8.0,<1.0.0",
    "torch>=2.0.0,<3.0.0",
]

docs = [
    "sphinx>=7.0.0,<8.0.0",
    "sphinx-rtd-theme>=1.2.0,<2.0.0",
    "myst-parser>=2.0.0,<3.0.0",
    "sphinx-autodoc-typehints>=1.24.0,<2.0.0",
]

reports = [
    "weasyprint>=60.0,<62.0",
    "python-docx>=0.8.11,<1.0.0",
    "markdown>=3.4.0,<4.0.0",
    "jinja2>=3.1.0,<4.0.0",
]

explainability = [
    "alibi>=0.9.0,<1.0.0",
    "dowhy>=0.11.0,<1.0.0",
]

integrations = [
    "optuna>=3.3.0,<4.0.0",
    "pymoo>=0.6.1,<1.0.0",
    "scikit-optimize>=0.9.0,<1.0.0",
]

all = [
    "elusight[dev,gp,docs,reports,explainability,integrations]",
]

[project.urls]
Homepage = "https://github.com/SubhraC-prog/EluSight"
Repository = "https://github.com/SubhraC-prog/EluSight.git"
Documentation = "https://github.com/SubhraC-prog/EluSight/docs"
Issues = "https://github.com/SubhraC-prog/EluSight/issues"
Changelog = "https://github.com/SubhraC-prog/EluSight/releases"

[project.scripts]
elusight-api = "elusight.api.routes:run_api"
elusight-dashboard = "elusight.dashboard.app:run_dashboard"
elusight-verify = "verify_installation:main"

[tool.setuptools]
packages = ["elusight", "elusight.schemas", "elusight.ingest", "elusight.constraints", "elusight.uncertainty", "elusight.robustness", "elusight.risk", "elusight.tradeoffs", "elusight.preferences", "elusight.explainability", "elusight.trust", "elusight.reasoning", "elusight.reports", "elusight.dashboard", "elusight.integrations", "elusight.api"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["elusight*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | docs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["elusight"]
known_third_party = ["numpy", "pandas", "scipy", "sklearn", "pydantic", "plotly", "streamlit", "fastapi"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "docs",
    "tests/__init__.py",
]
unfixable = []

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "docs/",
    "tests/",
    "examples/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=elusight",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
    "-n",
    "auto",
    "--timeout=30",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "benchmark: Performance benchmark tests",
]
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["elusight"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/docs/*",
    "*/examples/*",
    "*/venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "EluSight Coverage Report"

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples", "venv"]
tests = ["B101", "B102", "B301", "B302", "B303", "B304", "B305", "B306"]
skipped = ["B311", "B324", "B404", "B603", "B607"]
severity = "MEDIUM"
confidence = "MEDIUM"

[tool.pre-commit-config]
repos = [
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.4.0"},
    {repo = "https://github.com/psf/black", rev = "23.7.0"},
    {repo = "https://github.com/astral-sh/ruff", rev = "v0.0.280"},
    {repo = "https://github.com/pycqa/isort", rev = "5.12.0"},
]

[bdist_wheel]
universal = false

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"